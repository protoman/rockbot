name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdl:
        description: SDL version
        required: true
        default: sdl2
        type: choice
        options:
          - sdl2
          - sdl3
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - android
          - psp
          - switch

defaults:
  run:
    shell: bash

# required for upload
permissions:
  contents: write

jobs:

  Linux:
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'linux' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # ubuntu-26.04 ships libsdl3-*; 24.04 does not
        runner: [ ubuntu-26.04, ubuntu-26.04-arm ]
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-ubuntu.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          ARCH=$(uname -m)
          zip -9 -r rockbox-linux-${SDL_VERSION}-${ARCH}.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip

  macOS:
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'macos' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ macos-14, macos-15 ]
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-osx.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          ARCH=$(uname -m)
          zip -9 -r rockbox-osx-${{ matrix.runner }}-${SDL_VERSION}-${ARCH}.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip

  Windows:
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'windows' }}
    runs-on: ubuntu-24.04
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-windows.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          zip -9 -r rockbox-windows-${SDL_VERSION}-x86_64.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip

  Android:
    # Uses Pelya SDL 1.2 via Docker; ignores the sdl workflow input.
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h

      - name: Build RockDroid 1 APK
        env:
          ANDROID_ABIS: arm64-v8a
          NCPU: 2
        run: ./build-android.sh 1 release --no-sign

      - name: Build RockDroid 2 APK
        env:
          ANDROID_ABIS: arm64-v8a
          NCPU: 2
        run: ./build-android.sh 2 release --no-sign

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            build/packages/RockBot_Android_*.apk

  PSP:
    # Uses official pspdev/pspdev Docker image; SDL is always SDL2 for PSP.
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'psp' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h

      - name: Build RockDroid 1 EBOOT
        env:
          NCPU: 2
        run: ./build-psp.sh 1 --pull

      - name: Build RockDroid 2 EBOOT
        env:
          NCPU: 2
        run: ./build-psp.sh 2 --pull

      - name: Upload PSP packages
        uses: actions/upload-artifact@v4
        with:
          name: rockbot-psp
          path: build/packages/RockBot_PSP_*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            build/packages/RockBot_PSP_*.zip

  Switch:
    # Uses official devkitpro/devkita64 Docker image; SDL is always SDL2 for Switch.
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'switch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h

      - name: Build RockDroid 1 NRO
        env:
          NCPU: 2
        run: ./build-switch.sh 1 --pull

      - name: Build RockDroid 2 NRO
        env:
          NCPU: 2
        run: ./build-switch.sh 2 --pull

      - name: Upload Switch packages
        uses: actions/upload-artifact@v4
        with:
          name: rockbot-switch
          path: build/packages/RockBot_Switch_*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            build/packages/RockBot_Switch_*.zip
