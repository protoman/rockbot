name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdl:
        description: SDL version
        required: true
        default: sdl2
        type: choice
        options:
          - sdl2
          - sdl3
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

defaults:
  run:
    shell: bash

# required for upload
permissions:
  contents: write

jobs:

  Linux:
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'linux' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # ubuntu-26.04 ships libsdl3-*; 24.04 does not
        runner: [ ubuntu-26.04, ubuntu-26.04-arm ]
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-ubuntu.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          ARCH=$(uname -m)
          zip -9 -r rockbox-linux-${SDL_VERSION}-${ARCH}.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip

  macOS:
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'macos' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ macos-14, macos-15 ]
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-osx.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          ARCH=$(uname -m)
          zip -9 -r rockbox-osx-${{ matrix.runner }}-${SDL_VERSION}-${ARCH}.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip

  Windows:
    if: ${{ (github.event.inputs.platform || 'all') == 'all' || (github.event.inputs.platform || 'all') == 'windows' }}
    runs-on: ubuntu-24.04
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-windows.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          zip -9 -r rockbox-windows-${SDL_VERSION}-x86_64.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip
