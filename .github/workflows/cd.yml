name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdl:
        description: SDL version
        required: true
        default: sdl2
        type: choice
        options:
          - sdl2
          - sdl3

defaults:
  run:
    shell: bash

# required for upload
permissions:
  contents: write

jobs:

  Linux:
    # build-ubuntu.sh supports SDL1/SDL2 only
    if: ${{ github.event.inputs.sdl != 'sdl3' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-ubuntu.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          ARCH=$(uname -m)
          zip -9 -r rockbox-linux-${SDL_VERSION}-${ARCH}.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip

  macOS:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ macos-14, macos-15 ]
    env:
      SDL_VERSION: ${{ github.event.inputs.sdl || 'sdl2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ./build-osx.sh "${SDL_VERSION}"

      - name: Compress
        run: |
          ARCH=$(uname -m)
          zip -9 -r rockbox-osx-${{ matrix.runner }}-${SDL_VERSION}-${ARCH}.zip build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip
